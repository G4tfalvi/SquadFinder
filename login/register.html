<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SquadFinder - Regisztráció</title>
</head>

<body>
    <header class="navbar">
        <h1 class="title">
            <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://w3.org">
                <path d="M 50,15 L 76,28 L 76,55 L 66,74 L 50,85 L 34,74 L 24,55 L 24,28 Z" fill="none" stroke="#2563eb"
                    stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M 50,22 L 70,32 L 70,52 L 62,66 L 50,75 L 38,66 L 30,52 L 30,32 Z" fill="#000e2c"
                    stroke="#3b82f6" stroke-width="2" stroke-linejoin="round" />
                <path d="M 34,44 L 46,48 L 44,52 L 34,47 Z" fill="#60a5fa" />
                <path d="M 66,44 L 54,48 L 56,52 L 66,47 Z" fill="#60a5fa" />
                <path d="M 34,74 L 24,84 L 16,80" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M 66,74 L 76,84 L 84,80" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M 50,15 L 50,5" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
            </svg>
            Squad<span class="bluu">Finder</span>
        </h1>
    </header>

    <section class="auth-page-container">
        <div class="auth-card">
            <h2>Csatlakozz a Squadhoz!</h2>
            <p class="auth-subtitle">Hozz létre egy fiókot a csapattársak kereséséhez.</p>

            <form class="auth-form" action="#">
                <div class="auth-form-group">
                    <label for="reg-username">Felhasználónév</label>
                    <input type="text" id="reg-username" required pattern="[^/\-\.]+"
                        title="A felhasználónév nem tartalmazhat / - . karaktereket!"
                        placeholder="Válassz egy nevet...">
                </div>

                <div class="auth-form-group">
                    <label for="reg-email">E-mail cím</label>
                    <input type="email" id="reg-email" required pattern="[a-zA-Z0-9._%+-]+@gmail\.com$"
                        title="Kizárólag @gmail.com végződésű e-mail címet használhatsz!"
                        placeholder="példa@gmail.com">
                </div>

                <div class="auth-form-group">
                    <label for="reg-password">Jelszó</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="Minimum 6 karakter...">
                </div>

                <div class="auth-form-group">
                    <label for="reg-password-confirm">Jelszó megerősítése</label>
                    <input type="password" id="reg-password-confirm" required minlength="6"
                        placeholder="Írd be a jelszavad újra...">
                </div>

                <div id="register-error-message" class="auth-error-text"></div>
                <button type="submit" class="btn-submit-auth">Fiók létrehozása</button>

                <div class="auth-footer-text">
                    Már van fiókod? <a href="login.html">Jelentkezz be itt</a>
                </div>
            </form>
        </div>
    </section>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-left">
                <p class="footer-brand">SquadFinder © 2026</p>
                <p class="footer-copy">Minden jog fenntartva.</p>
            </div>
        </div>
    </footer>
    <script src="auth.js"></script>
</body>

</html>
